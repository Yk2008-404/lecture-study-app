    <section class="intro" aria-labelledby="gate-title"><span class="version">ダウンロード</span><h1 id="gate-title">合言葉を入力</h1><p>PC版のダウンロードは、合言葉を受け取った方だけが利用できます。受け取った合言葉を入力してください。</p></section>
    <style>
      .gate{max-width:440px;margin-top:6px}.gate label{display:block;font-size:13px;font-weight:650}
      .gate-row{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
      .gate-row:focus-within{outline:3px solid var(--accent);outline-offset:2px}
      .gate-row input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;letter-spacing:.04em;padding:12px 14px;outline:none}
      .gate-toggle{display:flex;align-items:center;gap:6px;border:0;border-left:1px solid var(--line);background:var(--soft);color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:0 15px;cursor:pointer;white-space:nowrap}
      .gate-toggle svg{width:18px;height:18px}
      .gate .download-button{width:100%;justify-content:center;border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:650;margin-top:14px}
      .gate-error{color:#c0392b;font-size:13px;margin-top:10px}
    </style>

      <label for="beta-passphrase">合言葉</label>

        <input id="beta-passphrase" type="password" required autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="受け取った合言葉">
        <button id="beta-show" class="gate-toggle" type="button" aria-pressed="false" aria-controls="beta-passphrase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>表示</span></button>
      </div>
      <button class="download-button" type="submit">開く</button>
      <p id="beta-error" role="alert" class="gate-error" hidden>合言葉が違います。「表示」を押して、入力した文字を確かめてください。</p>
    </form>
    <noscript><p>このページを開くにはJavaScriptが必要です。</p></noscript>

    show.addEventListener('click', function () {
      var visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      show.querySelector('span').textContent = visible ? '隠す' : '表示';
      show.setAttribute('aria-pressed', String(visible));
      input.focus();
    });
    var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      error.hidden = true;
      try {
        var material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value.trim().normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(sealed.salt), iterations: sealed.iterations }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

        document.querySelector('main').innerHTML = new TextDecoder().decode(plain);
      } catch (e) { error.hidden = false; input.select(); }
