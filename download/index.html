    <section class="intro" aria-labelledby="gate-title"><span class="version">ダウンロード</span><h1 id="gate-title">合言葉を入力</h1><p>PC版のダウンロードは、合言葉を受け取った方だけが利用できます。受け取った合言葉を入力してください。</p></section>
    <style>
      .gate{max-width:440px;margin-top:6px}.gate label{display:block;font-size:13px;font-weight:650}
      .gate-row{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
      .gate-row:focus-within{outline:3px solid var(--accent);outline-offset:2px}
      .gate-row input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;letter-spacing:.04em;padding:12px 14px;outline:none}
      .gate-toggle{display:flex;align-items:center;gap:6px;border:0;border-left:1px solid var(--line);background:var(--soft);color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:0 15px;cursor:pointer;white-space:nowrap}
      .gate-toggle svg{width:18px;height:18px}
      .gate .download-button{width:100%;justify-content:center;border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:650;margin-top:14px}
      .gate-error{color:#c0392b;font-size:13px;margin-top:10px}

      </div>
      <button class="download-button" type="submit">開く</button>
      <p id="beta-error" role="alert" class="gate-error" hidden>合言葉が違います。「表示」を押して、入力した文字を確かめてください。</p>
    </form>
