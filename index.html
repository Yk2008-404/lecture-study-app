<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>学習アプリは新しいURLに移りました</title>
<style>
  :root { --bg: #f5f6fa; --surface: #fff; --fg: #1d1f2b; --muted: #636779; --border: #dfe1ea; --accent: #5253d9; --danger: #c0392b; --danger-soft: #fbe9e7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161f; --surface: #1d2030; --fg: #eceef6; --muted: #a2a6b8; --border: #30344a; --accent: #a7a8ff; --danger: #ff8a7a; --danger-soft: #3b1f1c; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.75; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; margin: 1rem 0; }
  .muted { color: var(--muted); font-size: .88rem; }
  .url { font-size: 1.05rem; font-weight: 600; word-break: break-all; }
  button, a.button { display: block; width: 100%; text-align: center; font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--fg); border-radius: 10px; padding: .6rem 1rem; min-height: 48px; margin: .5rem 0 0; cursor: pointer; text-decoration: none; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: .6rem .9rem; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>学習アプリは新しいURLに移りました</h1>
  <p>これからは、こちらを使ってください。</p>
  <p class="url"><a id="new-url" href="https://lecture-study.pages.dev/">https://lecture-study.pages.dev/</a></p>

  <section id="has-data" class="panel" hidden>
    <p style="margin-top:0"><strong>この端末の学習記録を、新しいURLへ持っていけます。</strong></p>
    <p id="summary" class="muted"></p>
    <button id="move" type="button" class="primary">学習記録を持って新しいURLへ</button>
    <button id="save" type="button">ファイルに保存（うまく移れないとき）</button>
    <p class="muted">ファイルに保存したときは、新しいURLの <a href="https://lecture-study.pages.dev/move/">引き継ぎの画面</a> でそのファイルを選びます。
      ホーム画面に追加して使っていた場合は、新しいURLもホーム画面に追加し直してください。</p>
  </section>
  <section id="no-data" class="panel" hidden>
    <p style="margin:0">この端末には、前のURLの学習記録はありません。</p>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
  <a id="go" class="button" href="https://lecture-study.pages.dev/">記録を持たずに新しいURLを開く</a>
</main>
<script src="vendor/fflate-0.8.2.js"></script>
<script src="transfer.js"></script>
<script src="farewell.js"></script>
</body>
</html>
